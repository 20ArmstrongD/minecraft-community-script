name: validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests
        run: bash tools/check.sh --offline
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - name: ShellCheck
        run: shellcheck -x install.sh ct/minecraft.sh install/minecraft-install.sh scripts/minecraft tools/check.sh
      - name: shfmt
        if: ${{ !cancelled() }}
        run: shfmt -d -i 2 install.sh ct/minecraft.sh install/minecraft-install.sh scripts/minecraft tools/check.sh
      - name: Validate systemd unit syntax (commands substituted; no services started)
        run: |
          stage=$(mktemp -d)
          for unit in systemd/*; do
            sed 's|^ExecStart=.*|ExecStart=/usr/bin/true|' "$unit" > "$stage/$(basename "$unit")"
          done
          systemd-analyze verify "$stage/minecraft-server.service" "$stage/minecraft-backup.service" "$stage/minecraft-backup.timer"
